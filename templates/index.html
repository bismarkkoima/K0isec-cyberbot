<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>k0isec GPT Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="static/images/koisec-logoofl.png" alt="K0isec Logo" class="logo">
        </div>
        <div class="text-container">
            <h1><span class="green">k0</span>isec<span class="green">GPT</span></h1>
            <p class="tagline">&#9656; Secure. Encrypted. Anonymous.</p>
        </div>
    </header>
    <main>
        <div class="terminal-window">
            <div id="chat-log" class="chat-log">
                <!-- System message -->
                <div class="message system">k0i: Welcome to the k0isec AI Terminal. How can I assist you?</div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your command..." autofocus autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </main>

    <footer>
        <p>k0isec <span class="green">Cyber Sentinel</span> &copy; 2025</p>
    </footer>

    <script>
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatLog = document.getElementById("chat-log");

        sendBtn.addEventListener("click", sendMessage);
        inputField.addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });

        function appendMessage(content, role = "user") {
            const messageEl = document.createElement("div");
            messageEl.classList.add("message", role);
            messageEl.textContent = content;  // Display the message content directly
            chatLog.appendChild(messageEl);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;
            appendMessage(message, "user");
            inputField.value = "";
            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (data.reply) {
                    appendMessage(data.reply, "ai");
                } else {
                    appendMessage("Error: " + data.error, "ai");
                }
            } catch (err) {
                appendMessage("Error: Failed to reach server", "ai");
            }
        }
    </script>
</body>
</html>
